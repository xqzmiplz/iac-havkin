# все задачи выполняются на своём раннере: тег — маркер варианта
default:
  tags:
    - havkin-02          # у вас — свой префикс

stages:
  - proverka

shellcheck:
  stage: proverka
  image: koalaman/shellcheck-alpine:stable
  script:
    - echo "Вариант 02, слово cloudlab"     # у вас — свои значения
    - shellcheck --version
    - find . -name '*.sh' -print
    - find . -name '*.sh' ! -path './work-01/commands.sh' -exec shellcheck {} +
