# все задачи выполняются на своём раннере: тег — маркер варианта
default:
  tags:
    - havkin-02          # у вас — свой префикс

stages:
  - proverka

shellcheck:
  stage: proverka
  image: koalaman/shellcheck-alpine:stable
  script:
    - echo "Вариант 02, слово cloudlab"     # у вас — свои значения
    - shellcheck --version
    - find . -name '*.sh' -print
    - find . -name '*.sh' ! -path './work-01/commands.sh' -exec shellcheck {} +


.yc:
  image: alpine:3.20
  before_script:
    - apk add --no-cache bash curl jq gettext openssh-keygen >/dev/null
    - curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -a -i /usr/local >/dev/null
    - export PATH=/usr/local/bin:$PATH
    - yc config profile create ci
    - yc config set service-account-key "$YC_KEY_havkin_02"   # у вас — суффикс своего окруже-ния
    - yc config set cloud-id "$YC_CLOUD_ID"
    - yc config set folder-id "$YC_FOLDER_ID"

# ручная задача: запускается кнопкой, ресурсов не создаёт
proverka-dostupa:
  extends: .yc
  stage: proverka
  when: manual
  script:
    - echo "Проверяю доступ, вариант 02, слово cloudlab"   # у вас — свои
    - yc vpc network list

